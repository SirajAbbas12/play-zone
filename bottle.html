<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottle Flip Master - Play Zone</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .game-arena {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            margin-top: 1rem;
            height: 500px;
            position: relative;
            text-align: center;
            overflow: hidden;
        }
        .stats-bar {
            display: flex;
            gap: 2rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            background: rgba(99, 102, 241, 0.1);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .stats-bar span {
            color: #6366f1;
        }
        .stage {
            width: 100%;
            height: 250px;
            position: relative;
            border-bottom: 4px solid #6366f1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .bottle {
            width: 40px;
            height: 100px;
            background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0.1));
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 10px 10px 6px 6px;
            position: absolute;
            bottom: 0;
            transform-origin: bottom center;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bottle-cap {
            width: 20px;
            height: 12px;
            background: #f43f5e;
            border-radius: 4px 4px 0 0;
            margin-top: -4px;
        }
        .bottle-water {
            width: 100%;
            height: 40%;
            background: rgba(14, 165, 233, 0.6);
            position: absolute;
            bottom: 0;
            border-radius: 0 0 4px 4px;
        }
        .controls-area {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
            align-items: center;
        }
        .power-bar-container {
            width: 80%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .power-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #10b981, #f59e0b, #f43f5e);
            transition: width 0.05s linear;
        }
        .btn-action {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 80%;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .btn-action:active {
            transform: scale(0.96);
        }
        .message {
            font-size: 0.95rem;
            font-weight: 600;
            color: #10b981;
            height: 20px;
        }
        .back-link {
            position: absolute;
            top: 1rem;
            left: 1rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <span class="logo-text">Play<span>Zone</span></span>
        </div>
        <div class="user-profile">
            <span class="siraj-tag">Siraj Sar</span>
        </div>
    </header>

    <main class="main-container">
        <div class="game-arena">
            <a href="index.html" class="back-link">← Back</a>
            
            <div class="stats-bar">
                Score: <span id="score">0</span> &nbsp;|&nbsp; Streak: <span id="streak">0</span>
            </div>

            <div class="message" id="gameMsg">Hold button to charge power & flip!</div>

            <div class="stage">
                <div class="bottle" id="bottle">
                    <div class="bottle-cap"></div>
                    <div class="bottle-water"></div>
                </div>
            </div>
            
            <div class="controls-area">
                <div class="power-bar-container">
                    <div class="power-bar" id="powerBar"></div>
                </div>
                <button class="btn-action" id="flipBtn">HOLD TO CHARGE & FLIP</button>
            </div>
        </div>
    </main>

    <script>
        let score = 0;
        let streak = 0;
        let power = 0;
        let powerDirection = 1;
        let isCharging = false;
        let chargeInterval;

        const bottle = document.getElementById('bottle');
        const powerBar = document.getElementById('powerBar');
        const scoreElem = document.getElementById('score');
        const streakElem = document.getElementById('streak');
        const gameMsg = document.getElementById('gameMsg');
        const flipBtn = document.getElementById('flipBtn');

        function startCharging(e) {
            e.preventDefault();
            if (isCharging) return;
            isCharging = true;
            power = 0;
            powerDirection = 3;
            gameMsg.textContent = "Charging power...";
            
            chargeInterval = setInterval(() => {
                power += powerDirection;
                if (power >= 100 || power <= 0) {
                    powerDirection *= -1;
                }
                powerBar.style.width = power + '%';
            }, 20);
        }

        function releaseFlip(e) {
            e.preventDefault();
            if (!isCharging) return;
            isCharging = false;
            clearInterval(chargeInterval);

            gameMsg.textContent = "Flipping...";
            flipBtn.disabled = true;

            // Determine success based on sweet spot power (e.g. between 65% and 85%)
            let isSuccessful = (power >= 60 && power <= 85);
            
            if (isSuccessful) {
                bottle.style.transform = 'translateY(-150px) rotate(360deg)';
                setTimeout(() => {
                    bottle.style.transform = 'translateY(0) rotate(0deg)';
                    score += 10;
                    streak += 1;
                    gameMsg.textContent = "🎉 Perfect Flip! +10 pts";
                    updateStats();
                    resetButton();
                }, 600);
            } else {
                let failRotation = power < 60 ? 'rotate(-90deg)' : 'rotate(270deg) translateY(20px)';
                bottle.style.transform = `translateY(-100px) ${failRotation}`;
                setTimeout(() => {
                    bottle.style.transform = 'translateY(0) rotate(0deg)';
                    streak = 0;
                    gameMsg.textContent = power < 60 ? "❌ Too Short!" : "❌ Too Far!";
                    updateStats();
                    resetButton();
                }, 600);
            }
        }

        function updateStats() {
            scoreElem.textContent = score;
            streakElem.textContent = streak;
        }

        function resetButton() {
            power = 0;
            powerBar.style.width = '0%';
            flipBtn.disabled = false;
        }

        // Event listeners for both touch and mouse
        flipBtn.addEventListener('mousedown', startCharging);
        flipBtn.addEventListener('mouseup', releaseFlip);
        flipBtn.addEventListener('touchstart', startCharging);
        flipBtn.addEventListener('touchend', releaseFlip);
    </script>
</body>
</html>
