<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottle Flip Master - Play Zone</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .game-arena {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            margin-top: 1rem;
            min-height: 480px;
            position: relative;
            text-align: center;
        }
        .stats-bar {
            display: flex;
            gap: 2rem;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2rem;
            background: rgba(99, 102, 241, 0.1);
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .stats-bar span {
            color: var(--accent);
        }
        .bottle-stage {
            width: 140px;
            height: 260px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            margin: 1.5rem auto;
            position: relative;
        }
        .bottle {
            width: 48px;
            height: 150px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border-radius: 12px 12px 20px 20px;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .bottle::before {
            content: '';
            position: absolute;
            top: -16px;
            left: 14px;
            width: 20px;
            height: 16px;
            background: #0ea5e9;
            border-radius: 4px 4px 0 0;
        }
        .btn-action {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 0.85rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
            transition: transform 0.1s ease, opacity 0.2s ease;
        }
        .btn-action:active {
            transform: scale(0.95);
        }
        .back-link {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .back-link:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <i data-lucide="gamepad-2" class="brand-icon"></i>
            <span class="logo-text">Play<span>Zone</span></span>
        </div>
        <div class="user-profile">
            <i data-lucide="user" class="profile-icon"></i>
            <span class="siraj-tag">Siraj Sar</span>
        </div>
    </header>

    <main class="main-container">
        <div class="game-arena">
            <a href="index.html" class="back-link"><i data-lucide="arrow-left"></i> Back to Hub</a>
            
            <div class="stats-bar">
                Score: <span id="score">0</span> &nbsp;|&nbsp; Streak: <span id="streak">0</span>
            </div>

            <div class="bottle-stage">
                <div class="bottle" id="bottle"></div>
            </div>
            
            <button class="btn-action" id="flipBtn">FLIP BOTTLE</button>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Play Zone. Managed by Siraj Sar.</p>
    </footer>

    <script>
        lucide.createIcons();
        const bottle = document.getElementById('bottle');
        const flipBtn = document.getElementById('flipBtn');
        const scoreEl = document.getElementById('score');
        const streakEl = document.getElementById('streak');

        let score = 0;
        let streak = 0;

        flipBtn.addEventListener('click', () => {
            flipBtn.disabled = true;
            const isSuccess = Math.random() > 0.35; // 65% success chance for engaging gameplay

            if (isSuccess) {
                bottle.style.transform = 'translateY(-120px) rotate(360deg)';
                setTimeout(() => {
                    bottle.style.transform = 'translateY(0) rotate(0deg)';
                    score += 10;
                    streak += 1;
                    updateUI();
                    flipBtn.disabled = false;
                }, 400);
            } else {
                bottle.style.transform = 'translateY(-80px) rotate(140deg)';
                setTimeout(() => {
                    bottle.style.transform = 'translateY(0) rotate(0deg)';
                    streak = 0;
                    updateUI();
                    flipBtn.disabled = false;
                }, 400);
            }
        });

        function updateUI() {
            scoreEl.textContent = score;
            streakEl.textContent = streak;
        }
    </script>
</body>
</html>
