<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watermelon Slice - Play Zone</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .game-arena {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            margin-top: 1rem;
            min-height: 450px;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .score-board {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 1.5rem;
        }
        .slice-target {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #10b981, #047857);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            transition: transform 0.1s ease, background 0.3s ease;
            margin: 2rem auto;
            user-select: none;
        }
        .slice-target:active {
            transform: scale(0.85) rotate(15deg);
        }
        .instruction {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 1rem;
        }
        .back-link {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <i data-lucide="gamepad-2" class="brand-icon"></i>
            <span class="logo-text">Play<span>Zone</span></span>
        </div>
        <div class="user-profile">
            <i data-lucide="user" class="profile-icon"></i>
            <span class="siraj-tag">Siraj Sar</span>
        </div>
    </header>

    <main class="main-container">
        <div class="game-arena">
            <a href="index.html" class="back-link"><i data-lucide="arrow-left"></i> Back to Hub</a>
            <div class="score-board">Slices: <span id="score">0</span> | Combo: <span id="combo">0</span></div>
            
            <div class="slice-target cursor-pointer" id="targetFruit" title="Click to Slice!">
                🍉
            </div>
            
            <p class="instruction">Tap or swipe the watermelon rapidly to score points!</p>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Play Zone. Managed by Siraj Sar.</p>
    </footer>

    <script>
        lucide.createIcons();

        let score = 0;
        let combo = 0;
        const targetFruit = document.getElementById('targetFruit');
        const scoreEl = document.getElementById('score');
        const comboEl = document.getElementById('combo');

        targetFruit.addEventListener('click', () => {
            score += 1;
            combo += 1;
            
            // Visual feedback animation effect
            targetFruit.style.transform = 'scale(1.1) rotate(-10deg)';
            setTimeout(() => {
                targetFruit.style.transform = 'scale(1) rotate(0deg)';
            }, 100);

            scoreEl.textContent = score;
            comboEl.textContent = combo;
        });
    </script>
</body>
</html>
