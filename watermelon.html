<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watermelon Slice - Play Zone</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .game-arena {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            margin-top: 1rem;
            min-height: 480px;
            position: relative;
            text-align: center;
        }
        .stats-bar {
            display: flex;
            gap: 2rem;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2rem;
            background: rgba(168, 85, 247, 0.1);
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }
        .stats-bar span {
            color: #a855f7;
        }
        .fruit-target {
            width: 130px;
            height: 130px;
            background: radial-gradient(circle at 30% 30%, #f43f5e, #be123c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1.5rem auto;
            position: relative;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(244, 63, 94, 0.3);
            border: 3px dashed rgba(255, 255, 255, 0.4);
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .fruit-target:active {
            transform: scale(0.85) rotate(15deg);
        }
        .fruit-inner {
            font-size: 2.5rem;
        }
        .btn-action {
            background: linear-gradient(135deg, #f43f5e, #a855f7);
            color: white;
            border: none;
            padding: 0.85rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(244, 63, 94, 0.3);
            transition: transform 0.1s ease, opacity 0.2s ease;
        }
        .btn-action:active {
            transform: scale(0.95);
        }
        .back-link {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .back-link:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <i data-lucide="gamepad-2" class="brand-icon"></i>
            <span class="logo-text">Play<span>Zone</span></span>
        </div>
        <div class="user-profile">
            <i data-lucide="user" class="profile-icon"></i>
            <span class="siraj-tag">Siraj Sar</span>
        </div>
    </header>

    <main class="main-container">
        <div class="game-arena">
            <a href="index.html" class="back-link"><i data-lucide="arrow-left"></i> Back to Hub</a>
            
            <div class="stats-bar">
                Slices: <span id="slices">0</span> &nbsp;|&nbsp; Combo: <span id="combo">0</span>
            </div>

            <div class="fruit-target" id="fruitTarget" title="Slice the Watermelon!">
                <div class="fruit-inner">🍉</div>
            </div>
            
            <button class="btn-action" id="sliceBtn">SLICE FRUIT</button>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Play Zone. Managed by Siraj Sar.</p>
    </footer>

    <script>
        lucide.createIcons();
        const fruitTarget = document.getElementById('fruitTarget');
        const sliceBtn = document.getElementById('sliceBtn');
        const slicesEl = document.getElementById('slices');
        const comboEl = document.getElementById('combo');

        let slices = 0;
        let combo = 0;

        function performSlice() {
            slices += 1;
            combo += 1;
            slicesEl.textContent = slices;
            comboEl.textContent = combo;

            fruitTarget.style.transform = 'scale(1.2) rotate(360deg)';
            setTimeout(() => {
                fruitTarget.style.transform = 'scale(1) rotate(0deg)';
            }, 200);
        }

        fruitTarget.addEventListener('click', performSlice);
        sliceBtn.addEventListener('click', performSlice);
    </script>
</body>
</html>
