<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watermelon Slice - Play Zone</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .game-arena {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            margin-top: 1rem;
            height: 500px;
            position: relative;
            text-align: center;
            overflow: hidden;
            touch-action: none;
        }
        .stats-bar {
            display: flex;
            gap: 2rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            background: rgba(244, 63, 94, 0.1);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            border: 1px solid rgba(244, 63, 94, 0.2);
        }
        .stats-bar span {
            color: #f43f5e;
        }
        .slice-stage {
            width: 100%;
            height: 280px;
            position: relative;
            background: rgba(0,0,0,0.2);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fruit {
            font-size: 4rem;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
            position: absolute;
        }
        .fruit.sliced {
            transform: scale(1.4) rotate(45deg);
            opacity: 0;
        }
        .message {
            font-size: 0.95rem;
            font-weight: 600;
            color: #f43f5e;
        }
        .back-link {
            position: absolute;
            top: 1rem;
            left: 1rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <span class="logo-text">Play<span>Zone</span></span>
        </div>
        <div class="user-profile">
            <span class="siraj-tag">Siraj Sar</span>
        </div>
    </header>

    <main class="main-container">
        <div class="game-arena">
            <a href="index.html" class="back-link">← Back</a>
            
            <div class="stats-bar">
                Score: <span id="score">0</span> &nbsp;|&nbsp; Slices: <span id="slices">0</span>
            </div>

            <div class="message" id="gameMsg">Swipe or Tap the floating fruits to slice them!</div>

            <div class="slice-stage" id="stage" onclick="spawnFruit(event)">
                <div class="fruit" id="targetFruit" style="top: 80px; left: 130px;" onclick="sliceFruit(event)">🍉</div>
            </div>
            
            <div style="font-size: 0.85rem; color: var(--text-muted);">Tap/Click the fruit rapidly to slice!</div>
        </div>
    </main>

    <script>
        let score = 0;
        let sliceCount = 0;
        const fruits = ['🍉', '🍎', '🥝', '🍍', '🍊'];
        
        const targetFruit = document.getElementById('targetFruit');
        const scoreElem = document.getElementById('score');
        const slicesElem = document.getElementById('slices');
        const gameMsg = document.getElementById('gameMsg');

        function sliceFruit(e) {
            e.stopPropagation();
            score += 15;
            sliceCount += 1;
            
            scoreElem.textContent = score;
            slicesElem.textContent = sliceCount;
            gameMsg.textContent = "🔪 Slice successful! +15 pts";

            targetFruit.classList.add('sliced');
            
            setTimeout(() => {
                moveFruitRandomly();
                targetFruit.classList.remove('sliced');
                gameMsg.textContent = "Keep slicing!";
            }, 300);
        }

        function moveFruitRandomly() {
            const randomFruit = fruits[Math.floor(Math.random() * fruits.length)];
            targetFruit.textContent = randomFruit;
            
            const randomX = Math.floor(Math.random() * 200) + 20;
            const randomY = Math.floor(Math.random() * 150) + 40;
            
            targetFruit.style.left = randomX + 'px';
            targetFruit.style.top = randomY + 'px';
        }
    </script>
</body>
</html>
