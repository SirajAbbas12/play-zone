<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Rush Reflex - Play Zone</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .game-arena {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            margin-top: 1rem;
            min-height: 450px;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .score-board {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 1.5rem;
        }
        .color-box {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            border-radius: 16px;
            margin: 1.5rem auto;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .color-box:active {
            transform: scale(0.9);
        }
        .instruction {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.5rem;
        }
        .back-link {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <i data-lucide="gamepad-2" class="brand-icon"></i>
            <span class="logo-text">Play<span>Zone</span></span>
        </div>
        <div class="user-profile">
            <i data-lucide="user" class="profile-icon"></i>
            <span class="siraj-tag">Siraj Sar</span>
        </div>
    </header>

    <main class="main-container">
        <div class="game-arena">
            <a href="index.html" class="back-link"><i data-lucide="arrow-left"></i> Back to Hub</a>
            <div class="score-board">Reflex Score: <span id="reflexScore">0</span></div>
            
            <div class="color-box cursor-pointer" id="colorBox" title="Tap Fast!">
                ⚡
            </div>
            
            <p class="instruction">Tap the glowing pulse box as fast as you can!</p>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Play Zone. Managed by Siraj Sar.</p>
    </footer>

    <script>
        lucide.createIcons();
        let reflexScore = 0;
        const colorBox = document.getElementById('colorBox');
        const reflexScoreEl = document.getElementById('reflexScore');

        colorBox.addEventListener('click', () => {
            reflexScore += 5;
            reflexScoreEl.textContent = reflexScore;
            
            // Random color shift effect on tap
            const colors = [
                'linear-gradient(135deg, #ec4899, #8b5cf6)',
                'linear-gradient(135deg, #06b6d4, #3b82f6)',
                'linear-gradient(135deg, #10b981, #059669)',
                'linear-gradient(135deg, #f59e0b, #d97706)'
            ];
            colorBox.style.background = colors[Math.floor(Math.random() * colors.length)];
        });
    </script>
</body>
</html>
