<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match - Play Zone</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .game-arena {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            margin-top: 1rem;
            min-height: 450px;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .score-board {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 1.5rem;
        }
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 70px);
            gap: 12px;
            background: var(--bg-primary);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin: 1rem auto;
        }
        .memory-card {
            width: 70px;
            height: 70px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .memory-card:hover {
            border-color: var(--accent-color);
        }
        .instruction {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.5rem;
        }
        .back-link {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <i data-lucide="gamepad-2" class="brand-icon"></i>
            <span class="logo-text">Play<span>Zone</span></span>
        </div>
        <div class="user-profile">
            <i data-lucide="user" class="profile-icon"></i>
            <span class="siraj-tag">Siraj Sar</span>
        </div>
    </header>

    <main class="main-container">
        <div class="game-arena">
            <a href="index.html" class="back-link"><i data-lucide="arrow-left"></i> Back to Hub</a>
            <div class="score-board">Matches Found: <span id="matches">0</span> / 4</div>
            
            <div class="memory-grid">
                <div class="memory-card cursor-pointer" onclick="this.textContent='🚀'">❓</div>
                <div class="memory-card cursor-pointer" onclick="this.textContent='⭐'">❓</div>
                <div class="memory-card cursor-pointer" onclick="this.textContent='🎮'">❓</div>
                <div class="memory-card cursor-pointer" onclick="this.textContent='🔥'">❓</div>
                <div class="memory-card cursor-pointer" onclick="this.textContent='⭐'">❓</div>
                <div class="memory-card cursor-pointer" onclick="this.textContent='🚀'">❓</div>
                <div class="memory-card cursor-pointer" onclick="this.textContent='🔥'">❓</div>
                <div class="memory-card cursor-pointer" onclick="this.textContent='🎮'">❓</div>
            </div>
            
            <p class="instruction">Flip and match identical icon cards to win!</p>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Play Zone. Managed by Siraj Sar.</p>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
