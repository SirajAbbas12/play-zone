<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Multiplayer - Play Zone</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .game-arena {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            margin-top: 1rem;
            min-height: 450px;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .score-board {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 1.5rem;
        }
        .dice-box {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #fff;
            margin: 1.5rem auto;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.3);
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .dice-box:active {
            transform: scale(0.9) rotate(10deg);
        }
        .instruction {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.5rem;
        }
        .back-link {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <i data-lucide="gamepad-2" class="brand-icon"></i>
            <span class="logo-text">Play<span>Zone</span></span>
        </div>
        <div class="user-profile">
            <i data-lucide="user" class="profile-icon"></i>
            <span class="siraj-tag">Siraj Sar</span>
        </div>
    </header>

    <main class="main-container">
        <div class="game-arena">
            <a href="index.html" class="back-link"><i data-lucide="arrow-left"></i> Back to Hub</a>
            <div class="score-board">Turn: <span id="playerTurn">Player 1 (Red)</span> | Dice: <span id="diceVal">6</span></div>
            
            <div class="dice-box cursor-pointer" id="rollDiceBtn" title="Roll Dice!">
                🎲
            </div>
            
            <p class="instruction">Tap the dice to roll and advance your tokens home!</p>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Play Zone. Managed by Siraj Sar.</p>
    </footer>

    <script>
        lucide.createIcons();
        const diceBox = document.getElementById('rollDiceBtn');
        const diceValEl = document.getElementById('diceVal');
        const playerTurnEl = document.getElementById('playerTurn');
        
        const players = ['Player 1 (Red)', 'Player 2 (Green)', 'Player 3 (Yellow)', 'Player 4 (Blue)'];
        let turnIdx = 0;

        diceBox.addEventListener('click', () => {
            const roll = Math.floor(Math.random() * 6) + 1;
            diceValEl.textContent = roll;
            
            turnIdx = (turnIdx + 1) % players.length;
            playerTurnEl.textContent = players[turnIdx];
            
            diceBox.style.transform = 'scale(1.1) rotate(180deg)';
            setTimeout(() => {
                diceBox.style.transform = 'scale(1) rotate(0deg)';
            }, 200);
        });
    </script>
</body>
</html>
