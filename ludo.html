<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Master - Play Zone</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .game-arena {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            margin-top: 1rem;
            min-height: 480px;
            position: relative;
            text-align: center;
        }
        .stats-bar {
            display: flex;
            gap: 2rem;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2rem;
            background: rgba(16, 185, 129, 0.1);
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .stats-bar span {
            color: #10b981;
        }
        .dice-box {
            width: 100px;
            height: 100px;
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid #10b981;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 1.5rem auto;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.2);
        }
        .btn-action {
            background: linear-gradient(135deg, #10b981, #0ea5e9);
            color: white;
            border: none;
            padding: 0.85rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
        }
        .back-link {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <span class="logo-text">Play<span>Zone</span></span>
        </div>
        <div class="user-profile">
            <span class="siraj-tag">Siraj Sar</span>
        </div>
    </header>

    <main class="main-container">
        <div class="game-arena">
            <a href="index.html" class="back-link">← Back to Hub</a>
            
            <div class="stats-bar">
                Turn: <span id="turn">Player 1</span> &nbsp;|&nbsp; Last Roll: <span id="lastRoll">6</span>
            </div>

            <div class="dice-box" id="diceFace">🎲</div>
            
            <button class="btn-action" onclick="rollDice()">ROLL DICE</button>
        </div>
    </main>

    <script>
        const faces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
        function rollDice() {
            const roll = Math.floor(Math.random() * 6) + 1;
            document.getElementById('diceFace').textContent = faces[roll - 1];
            document.getElementById('lastRoll').textContent = roll;
        }
    </script>
</body>
</html>
