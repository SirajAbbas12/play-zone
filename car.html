<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Out Puzzle - Play Zone</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .game-arena {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 27, 75, 0.9));
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            padding: 1.5rem;
            margin-top: 1rem;
            min-height: 520px;
            position: relative;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .stats-bar {
            display: flex;
            gap: 2rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            background: rgba(99, 102, 241, 0.15);
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            border: 1px solid rgba(99, 102, 241, 0.4);
        }
        .stats-bar span {
            color: #38bdf8;
        }
        .parking-grid {
            width: 280px;
            height: 280px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #6366f1;
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 6px;
            padding: 6px;
            margin: 1rem auto;
            position: relative;
        }
        .car-tile {
            background: linear-gradient(135deg, #f43f5e, #fb7185);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(244, 63, 94, 0.4);
            transition: transform 0.2s;
        }
        .car-tile.player {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.6);
            border: 2px solid #fff;
        }
        .car-tile:active {
            transform: scale(0.95);
        }
        .message {
            font-size: 0.95rem;
            font-weight: 600;
            color: #38bdf8;
            height: 24px;
        }
        .btn-action {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .back-link {
            position: absolute;
            top: 1rem;
            left: 1rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header class="navbar" style="display:flex; justify-content:space-between; align-items:center; padding:1rem 2rem; background:var(--bg-card); border-bottom:1px solid var(--border);">
        <div class="logo-container">
            <span class="logo-text" style="font-weight:800; font-size:1.2rem; background:linear-gradient(135deg,#6366f1,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Play<span>Zone</span></span>
        </div>
        <div class="user-profile">
            <span class="siraj-tag" style="color:var(--text-muted); font-size:0.9rem;">Siraj Sar</span>
        </div>
    </header>

    <main class="main-container" style="padding: 1rem; max-width: 500px; margin: 0 auto;">
        <div class="game-arena">
            <a href="index.html" class="back-link">← Back</a>
            
            <div class="stats-bar">
                Level: <span>1</span> &nbsp;|&nbsp; Moves: <span id="moves">0</span>
            </div>

            <div class="message" id="gameMsg">Tap cars to clear the exit path!</div>

            <div class="parking-grid">
                <div class="car-tile player" style="grid-column: 1 / 3; grid-row: 2 / 3;" onclick="moveCar(this)">🏎️</div>
                <div class="car-tile" style="grid-column: 3 / 4; grid-row: 1 / 3;" onclick="moveCar(this)">🚗</div>
                <div class="car-tile" style="grid-column: 4 / 5; grid-row: 2 / 4;" onclick="moveCar(this)">🚙</div>
            </div>
            
            <button class="btn-action" onclick="resetPuzzle()">Reset Level</button>
        </div>
    </main>

    <script>
        let moves = 0;
        const movesElem = document.getElementById('moves');
        const gameMsg = document.getElementById('gameMsg');

        function moveCar(elem) {
            moves++;
            movesElem.textContent = moves;
            elem.style.transform = "translateX(30px)";
            setTimeout(() => {
                elem.style.transform = "translateX(0)";
            }, 200);
            gameMsg.textContent = "Great move! Keep clearing.";
        }

        function resetPuzzle() {
            moves = 0;
            movesElem.textContent = moves;
            gameMsg.textContent = "Puzzle reset. Tap cars to play!";
        }
    </script>
</body>
</html>
